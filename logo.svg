<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF4D63"/>
            <stop offset="55%" stop-color="#EB001B"/>
            <stop offset="100%" stop-color="#B80016"/>
        </linearGradient>
    </defs>

    <!-- App tile -->
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tileGrad)"
          stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

    <!-- Tilted credit card -->
    <g transform="rotate(-10 32 32)">
        <rect x="14" y="20" width="36" height="24" rx="4.5" fill="url(#cardGrad)"/>
        <rect x="14" y="25.5" width="36" height="5" fill="#7A0010" opacity="0.85"/>
        <rect x="18" y="33.5" width="7" height="5.5" rx="1.2" fill="#FFC2C6"/>
        <circle cx="30" cy="36.2" r="1.1" fill="#FFC2C6"/>
        <circle cx="34.5" cy="36.2" r="1.1" fill="#FFC2C6"/>
        <circle cx="39" cy="36.2" r="1.1" fill="#FFC2C6"/>
    </g>

    <!-- Generation sparkle -->
    <path d="M48.5 8.5 C49 11 50.5 12.5 53 13 C50.5 13.5 49 15 48.5 17.5 C48 15 46.5 13.5 44 13 C46.5 12.5 48 11 48.5 8.5 Z"
          fill="#FFFFFF"/>
</svg>
