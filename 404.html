<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CC-GEN</title>
    <link rel="icon" type="image/webp" href="logo.webp">
    <script src="theme.js"></script>
    <style>
        :root {
            --primary-color: #EB001B;
            --bg-page: #F8FAFC;
            --text-heading: #0F172A;
            --text-muted: #64748B;
            --font-main: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        [data-theme="dark"] {
            --bg-page: #090D16;
            --text-heading: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            color: var(--text-heading);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 480px; }
        .code {
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #EB001B, #B80016);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin: 18px 0 10px; }
        p { color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 26px;
            border-radius: 9999px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, #EB001B, #B80016);
            color: #fff;
            box-shadow: 0 10px 24px -10px rgba(235, 0, 27, 0.55);
        }
        .btn-secondary {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-heading);
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        .brand {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 800;
            letter-spacing: 0.05em;
            font-size: 1.05rem;
        }
        .brand span { color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="brand"><span>CC-GEN</span></div>
    <div class="wrap">
        <div class="code">404</div>
        <h1>This page declined the transaction</h1>
        <p>The page you're looking for doesn't exist or may have moved. Your card numbers are safe — this link just isn't valid.</p>
        <div class="actions">
            <a href="index.html" class="btn btn-primary">Back to Home</a>
            <a href="cc-gen.html" class="btn btn-secondary">Card Library</a>
            <a href="faq.html" class="btn btn-secondary">FAQs</a>
        </div>
    </div>
</body>
</html>
